services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/baku_transit.db
      OPERATOR_KEY: ${OPERATOR_KEY:-local-demo-key}
      REPORT_COOLDOWN_SECONDS: ${REPORT_COOLDOWN_SECONDS:-60}
      REPORT_FRESHNESS_SECONDS: ${REPORT_FRESHNESS_SECONDS:-120}
    volumes:
      - transit_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  transit_data:
